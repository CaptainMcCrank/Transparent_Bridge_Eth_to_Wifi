---

   - name: Verify BRIDGE_PI_PASSWORD is set in the build environment
     assert:
       that:
         - ssh_password_pi | length > 0
       quiet: true
       fail_msg: "BRIDGE_PI_PASSWORD is not set. Export it in the Ansible build container before running the playbook (it becomes the pi user's login password)."

   - name: Verify BRIDGE_WIFI_PASSWORD is set and a valid WPA2 passphrase (8-63 characters)
     assert:
       that:
         - wifi_password | length >= 8
         - wifi_password | length <= 63
       quiet: true
       fail_msg: "BRIDGE_WIFI_PASSWORD is not set or is not 8-63 characters. Export a valid WPA2 passphrase in the Ansible build container before running the playbook."
