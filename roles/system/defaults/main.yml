---
py_version: 3.8.0
threads: 4
temp_folder: /tmp

root_playbook_dir: /home/pi/Playbooks/Transparent_Bridge_Eth_to_Wifi
os_info_path: /etc/os-release
int_count: "{{ ansible_interfaces | count }}"
ansible_python_interpreter: "/usr/bin/python3.9"
Target_Hostname: "WifiAP"
docker_host: "{{ lookup('ansible.builtin.env', 'DOCKER_HOST') }}"
# Credentials come from the build environment; never commit real values here.
# Set BRIDGE_PI_PASSWORD and BRIDGE_WIFI_PASSWORD in the Ansible build
# container before running the playbook. credential_checks.yml fails the run
# early if either is missing or the wifi passphrase is not 8-63 chars.
ssh_password_pi: "{{ lookup('ansible.builtin.env', 'BRIDGE_PI_PASSWORD') }}"
wifi_password: "{{ lookup('ansible.builtin.env', 'BRIDGE_WIFI_PASSWORD') }}"
wifi_network_ssid: "workshop"
hostapd_file: "WifiRepeaterHostAPD.conf"
wifi_interface: "wlan0"
version:
  Build: WifiExtender
  BuildDate: "10_05_23"
  Ver: 0.1
  Author: p@mccannabanana.com
  Description: A Transparent Bridging wifi repeater


